name: verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw --batch-mode clean verify
  python-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        transport: [tcp, http]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Query-farm/vgi
          ref: e75482339d07244105e4a040f998a7092b7402a5
          path: .conformance/upstream
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: conformance/requirements.txt
      - run: python -m pip install -r conformance/requirements.txt
      - run: python -m unittest discover -s conformance -v
      - id: build
        run: ./mvnw --batch-mode -DskipTests package
      - name: Reject malformed worker batches
        run: >-
          python conformance/run.py --suite conformance/malformed
          --worker-script .conformance/upstream/test/support/malformed_batch_worker.py
          --transport ${{ matrix.transport }}
          --report target/conformance/malformed/report.json
      - name: Adapter checks against the Python worker
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: >-
          python conformance/run.py --suite conformance/sql
          --transport ${{ matrix.transport }}
          --report target/conformance/adapter/report.json
      - name: Upstream table-function regression gate
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: >-
          python conformance/run.py --suite .conformance/upstream/test/sql
          --include integration/table/double_sequence.test
          --include integration/table/positional_args.test
          --include integration/table/projection_info.test
          --include integration/table/sequence.test
          --include integration/table/filtered_columns_pushdown.test
          --transport ${{ matrix.transport }}
          --report target/conformance/upstream/report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-worker-${{ matrix.transport }}
          path: target/conformance/
